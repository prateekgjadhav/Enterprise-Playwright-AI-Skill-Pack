# Nightly re-index of the knowledge layer, reusing cached embeddings. The index never leaves the runner as an artifact.
name: knowledge-reindex
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  reindex:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@v2 # pin: renovate
        with: { egress-policy: block, allowed-endpoints: "github.com:443 api.github.com:443" }
      - uses: actions/checkout@v5 # pin: renovate
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v5 # pin: renovate
        with: { node-version-file: .nvmrc }
      - uses: actions/cache@v4 # pin: renovate
        with: { path: .agents/rag-index/embedding-cache.json, key: "rag-embeddings-${{ github.run_id }}", restore-keys: rag-embeddings- }
      - run: node rag/cli.mjs ingest && node rag/cli.mjs status
